<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grievance Agent · HR Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand"><h1>Grievance <span>Agent</span></h1><p>HR console · authorised case handlers only</p></div>
  <button class="ghost" id="logout" type="button" hidden style="color:var(--navy-muted);border-color:var(--navy-muted)">Sign out</button>
</div></header>
<main class="wrap page">
  <form class="pane login" id="loginForm">
    <h2>HR sign in</h2>
    <div class="fld"><label for="hrName">Your name</label><input id="hrName" type="text" maxlength="80" autocomplete="name" required></div>
    <div class="fld"><label for="hrPass">HR password</label><input id="hrPass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr" hidden></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <div class="console" id="console" hidden>
    <section class="pane" aria-label="Cases">
      <div class="pane-h"><h2>Cases</h2><button class="ghost" id="refresh" type="button">Refresh</button></div>
      <div class="filters">
        <select id="fStatus" aria-label="Filter by status"><option value="open">Open cases</option><option value="all">All cases</option><option value="closed">Closed</option></select>
        <select id="fType" aria-label="Filter by type"><option value="">All types</option><option>Formal</option><option>Informal</option></select>
      </div>
      <div class="cases" id="cases"></div>
    </section>
    <section class="pane" aria-label="Case detail"><div class="detail" id="detail"><div class="empty">Select a case to see its details.</div></div></section>
  </div>
</main>
<div class="toast" id="toast" hidden></div>
<script src="/hr.js"></script>
</body>
</html>
